<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>栄冠ラグビー Prototype</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;background:#eef2f5;color:#17202a}
*{box-sizing:border-box}body{margin:0}.app{max-width:520px;margin:auto;min-height:100vh;background:#fff}
header{padding:18px 16px;background:#173f2b;color:white;position:sticky;top:0;z-index:3}
h1,h2,p{margin:0 0 8px}.sub{opacity:.8;font-size:13px}
main{padding:14px 14px 90px}.card{border:1px solid #dbe2e8;border-radius:14px;padding:14px;margin-bottom:12px;background:#fff;box-shadow:0 2px 8px #00000008}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.team{padding:12px;border:1px solid #ccd6dd;border-radius:12px;text-align:left;background:#fafcfd}
.team b{display:block}.team small{color:#687782}.btn{border:0;border-radius:10px;padding:11px 13px;font-weight:700;background:#1c6b43;color:#fff}.btn.secondary{background:#e9eef1;color:#20303a}.btn:disabled{opacity:.45}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}.pill{font-size:11px;padding:3px 7px;border-radius:99px;background:#edf4ef;color:#1c6b43}.danger{background:#fff0ef;color:#a33}
table{width:100%;border-collapse:collapse;font-size:12px}td,th{padding:7px 4px;border-bottom:1px solid #edf0f2;text-align:left}.right{text-align:right}.bar{height:7px;background:#e7ecef;border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:#2e7d52}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);max-width:520px;width:100%;display:grid;grid-template-columns:repeat(4,1fr);background:#fff;border-top:1px solid #ddd}.nav button{border:0;background:white;padding:10px 2px;font-size:11px}.nav button b{display:block;font-size:16px}
.notice{padding:10px;border-radius:10px;background:#f4f8f5;font-size:13px}.hero{background:linear-gradient(135deg,#173f2b,#276849);color:#fff;border-radius:16px;padding:18px;margin-bottom:12px}
</style>
</head>
<body><div class="app">
<header><h1>栄冠ラグビー</h1><div class="sub" id="date"></div></header>
<main id="main"></main>
<nav class="nav">
<button onclick="screen='home';render()"><b>🏠</b>ホーム</button>
<button onclick="screen='players';render()"><b>👥</b>選手</button>
<button onclick="screen='scout';render()"><b>🔎</b>スカウト</button>
<button onclick="screen='world';render()"><b>🌏</b>世界</button>
</nav></div>
<script>
const positions=["PR","HO","LO","FL","No.8","SH","SO","CTB","WTB","FB"];
const surnames=["佐藤","鈴木","高橋","田中","伊藤","山本","中村","小林","加藤","吉田","山田","佐々木","松本","井上","木村","林","清水","山口","阿部","森"];
const given=["蓮","翔太","悠真","大輝","健太","颯","陽向","直樹","拓海","湊","悠斗","蓮斗","優","陸","蒼","樹"];
const schools=[
["桐蔭学園","神奈川",86],["東福岡","福岡",88],["大阪桐蔭","大阪",84],
["國學院栃木","栃木",80],["京都成章","京都",82],["佐賀工業","佐賀",79],
["常翔学園","大阪",81],["御所実業","奈良",80],["流通経済大柏","千葉",82],["報徳学園","兵庫",83]
];
let state=JSON.parse(localStorage.getItem("rugby_crown_save")||"null");
let screen="home";
function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a}
function name(){return surnames[rnd(0,surnames.length-1)]+" "+given[rnd(0,given.length-1)]}
function player(year=1,boost=0){
 let pos=positions[rnd(0,positions.length-1)], talent=Math.random()<.02;
 let base=rnd(35,72)+boost, p={id:crypto.randomUUID(),name:name(),year,pos,talent,foreign:false,
 stats:{power:cl(base),speed:cl(base+rnd(-10,10)),stamina:cl(base+rnd(-8,8)),pass:cl(base+rnd(-10,10)),kick:cl(base+rnd(-12,12)),tackle:cl(base+rnd(-8,8)),decision:cl(base+rnd(-8,8))}};
 if(talent) for(let k in p.stats)p.stats[k]=cl(Math.round(p.stats[k]*1.5));
 return p;
}
function cl(n){return Math.max(1,Math.min(100,n))}
function overall(p){return Math.round(Object.values(p.stats).reduce((a,b)=>a+b,0)/Object.keys(p.stats).length)}
function makeTeam(s){
 let players=[]; for(let i=0;i<20;i++)players.push(player(rnd(1,3),Math.round((s[2]-65)/2)));
 return {school:s[0],pref:s[1],base:s[2],players};
}
function init(){let teams=schools.map(makeTeam); state={year:2026,month:4,selected:null,teams,scouts:5,worldBest:[],history:[],message:"高校を選択してください。"};save()}
function save(){localStorage.setItem("rugby_crown_save",JSON.stringify(state))}
function selected(){return state.teams[state.selected]}
function advanceMonth(){
 if(state.selected===null){state.message="先に高校を選択してください。";render();return}
 let t=selected(), type=document.querySelector("#practice")?.value||"フィジカル";
 let map={フィジカル:["power"],ランニング:["speed","stamina"],パス:["pass"],キック:["kick"],タックル:["tackle"],戦術:["decision"],総合:["power","speed","stamina","pass","kick","tackle","decision"],休養:[]};
 for(let p of t.players){let n=map[type]; for(let k of n)p.stats[k]=cl(p.stats[k]+rnd(1,3));}
 state.message=`${state.year}年${state.month}月：${type}を実施。選手が成長しました。`;
 if(state.month===2) runWorld();
 if(state.month===3) graduate();
 state.month++; if(state.month===13){state.month=1;state.year++;}
 save();render();
}
function scout(){
 if(state.scouts<=0)return;
 let p=player(1,rnd(-5,15)); if(Math.random()<.08){p.foreign=true;for(let k in p.stats)p.stats[k]=cl(p.stats[k]+rnd(8,18))}
 state.scouts--; state.lastScout=p; save();render();
}
function signScout(){if(!state.lastScout||state.selected===null)return;selected().players.push(state.lastScout);state.lastScout=null;save();render()}
function runWorld(){
 let all=state.teams.flatMap(t=>t.players.map(p=>({...p,school:t.school})));
 all.sort((a,b)=>overall(b)-overall(a)); state.worldBest=all.slice(0,15);
 let avg=state.worldBest.reduce((a,p)=>a+overall(p),0)/15;
 let japan=selected()?Math.round(selected().players.slice().sort((a,b)=>overall(b)-overall(a)).slice(0,15).reduce((a,p)=>a+overall(p),0)/15):avg;
 state.message=`2月・世界ベスト15戦：日本選抜平均 ${Math.round(japan)} vs 世界選抜平均 ${Math.round(avg+7)}。`;
 state.history.push({year:state.year,best:state.worldBest.map(p=>p.name)});
}
function graduate(){
 let t=selected(), graduates=t.players.filter(p=>p.year===3);
 graduates.forEach(p=>{p.path=overall(p)>=68?"大学ラグビー":"引退";});
 t.players=t.players.filter(p=>p.year!==3).map(p=>({...p,year:p.year+1}));
 for(let i=0;i<5;i++)t.players.push(player(1,rnd(-3,10)));
 state.scouts=5; state.message+=` 卒業 ${graduates.length}名、新入生5名。`;
}

function startMatch(){
 if(state.selected===null){state.message="高校を選択してください。";render();return}
 state.match={opponent:randomOpponent(), tactic:"バランス", starters:[], log:[], home:0,away:0,minute:0,done:false};
 screen="match"; render();
}
function randomOpponent(){
 const pool=state.teams.filter((_,i)=>i!==state.selected);
 const t=pool[rnd(0,pool.length-1)];
 return {school:t.school,base:t.base+rnd(-4,4)};
}
function selectedPlayers(){
 return selected().players.slice().sort((a,b)=>overall(b)-overall(a));
}
function toggleStarter(id){
 if(!state.match)return;
 const i=state.match.starters.indexOf(id);
 if(i>=0) state.match.starters.splice(i,1);
 else if(state.match.starters.length<15) state.match.starters.push(id);
 render();
}
function setTactic(v){state.match.tactic=v;render()}
function runMatch(){
 if(!state.match)return;
 if(state.match.starters.length!==15){state.message="スタメンを15人選んでください。";render();return}
 const t=selected(), starters=t.players.filter(p=>state.match.starters.includes(p.id));
 const avg=starters.reduce((a,p)=>a+overall(p),0)/15;
 const atk=starters.reduce((a,p)=>a+p.stats.speed+p.stats.pass+p.stats.kick,0)/45;
 const def=starters.reduce((a,p)=>a+p.stats.tackle+p.stats.stamina+p.stats.decision,0)/45;
 const tacticBonus={攻撃重視:5,バランス:0,守備重視:-2,キック重視:2}[state.match.tactic];
 let home=cl(Math.round(avg+tacticBonus+rnd(-6,6)));
 let away=cl(Math.round(state.match.opponent.base+rnd(-7,7)));
 let events=[], hs=0, as=0;
 for(let m=5;m<=80;m+=rnd(4,9)){
   let chance=(home-away)*.8+(atk+def-100)*.12+rnd(-18,18)+tacticBonus;
   if(chance>18){hs+=rnd(3,7); events.push(`${m}分：${starters[rnd(0,14)].name} の突破からトライ！ コンバージョン成功。`)}
   else if(chance<-12){as+=rnd(3,7); events.push(`${m}分：相手がトライ。コンバージョン成功。`)}
   else if(Math.random()<.18){hs+=rnd(2,3);events.push(`${m}分：ペナルティゴール成功。`)}
   else if(Math.random()<.16){as+=rnd(2,3);events.push(`${m}分：相手がペナルティゴール成功。`)}
 }
 state.match.home=hs;state.match.away=as;state.match.log=events;state.match.minute=80;state.match.done=true;
 if(hs>as){state.message=`試合終了！ ${t.school} ${hs} - ${as} ${state.match.opponent.school}`;}
 else if(hs<as){state.message=`試合終了。 ${t.school} ${hs} - ${as} ${state.match.opponent.school}`;}
 else {state.message=`試合終了。 ${t.school} ${hs} - ${as} ${state.match.opponent.school}（引き分け）`;}
 save();render();
}
function matchScreen(){
 if(!state.match)return `<div class="card"><button class="btn" onclick="startMatch()">試合を始める</button></div>`;
 const t=selected(), ps=selectedPlayers();
 if(!state.match.done)return `<div class="hero"><h2>🏉 試合前</h2><p>${t.school} vs ${state.match.opponent.school}</p><p>15人を選び、戦術を決定してください。</p></div>
 <div class="card"><div class="row"><b>戦術</b><select onchange="setTactic(this.value)"><option>バランス</option><option>攻撃重視</option><option>守備重視</option><option>キック重視</option></select></div></div>
 <div class="card"><div class="row"><h2>スタメン</h2><span class="pill">${state.match.starters.length}/15</span></div>
 <table><tr><th>選択</th><th>選手</th><th>Pos</th><th>総合</th></tr>${ps.map(p=>`<tr><td><button class="btn ${state.match.starters.includes(p.id)?"secondary":""}" onclick="toggleStarter('${p.id}')">${state.match.starters.includes(p.id)?"外す":"選ぶ"}</button></td><td>${p.name}${p.talent?" ⭐":""}</td><td>${p.pos}</td><td>${overall(p)}</td></tr>`).join("")}</table></div>
 <button class="btn" style="width:100%" onclick="runMatch()" ${state.match.starters.length!==15?"disabled":""}>キックオフ</button>`;
 return `<div class="hero"><h2>🏉 試合終了</h2><p>${t.school} ${state.match.home} - ${state.match.away} ${state.match.opponent.school}</p><p>${state.match.home>state.match.away?"勝利！":state.match.home<state.match.away?"敗戦":"引き分け"}</p></div>
 <div class="card"><h2>得点経過</h2>${state.match.log.map(e=>`<p class="notice">${e}</p>`).join("")}</div>
 <div class="card"><h2>戦術</h2><p>${state.match.tactic}</p><button class="btn secondary" onclick="startMatch()">もう一度試合</button></div>`;
}

function render(){
 document.getElementById("date").textContent=state?`${state.year}年 ${state.month}月`: "Prototype";
 if(!state){document.getElementById("main").innerHTML=`<div class="hero"><h2>高校ラグビー育成シミュレーション</h2><p>全国制覇から日本代表、世界の舞台へ。</p></div><div class="card"><h2>新規ゲーム</h2><p>高校を選んでスタートします。</p><button class="btn" onclick="init();render()">ゲーム開始</button></div>`;return}
 let html="";
 if(screen==="home")html=home();
 if(screen==="players")html=players();
 if(screen==="scout")html=scoutScreen();
 if(screen==="world")html=world();
 if(screen==="match")html=matchScreen();
 document.getElementById("main").innerHTML=html;
}
function home(){
 if(state.selected===null)return `<div class="hero"><h2>高校を選択</h2><p>前年大会を参考にした仮想高校データです。</p></div><div class="grid">${state.teams.map((t,i)=>`<button class="team" onclick="state.selected=${i};save();render()"><b>${t.school}</b><small>${t.pref} / 戦力 ${t.base}</small></button>`).join("")}</div>`;
 let t=selected(); return `<div class="hero"><h2>${t.school}</h2><p>${t.pref}県　チーム戦力 ${t.base}</p></div><div class="card"><button class="btn" style="width:100%" onclick="startMatch()">🏉 練習試合・大会戦を始める</button></div>
 <div class="card"><div class="row"><b>今月の練習</b><span class="pill">${t.players.length}人</span></div><select id="practice" style="width:100%;padding:11px;margin:10px 0"><option>フィジカル</option><option>ランニング</option><option>パス</option><option>キック</option><option>タックル</option><option>戦術</option><option>総合</option><option>休養</option></select><button class="btn" onclick="advanceMonth()">1か月進める</button></div>
 <div class="card"><div class="notice">${state.message}</div></div>`;
}
function players(){
 if(state.selected===null)return `<div class="card">高校を選択してください。</div>`;
 let ps=selected().players.slice().sort((a,b)=>b.year-a.year||overall(b)-overall(a));
 return `<div class="card"><h2>選手名簿</h2><table><tr><th>選手</th><th>学年</th><th>Pos</th><th class="right">総合</th></tr>${ps.map(p=>`<tr><td>${p.name}${p.talent?" ⭐":""}${p.foreign?" 🌍":""}</td><td>${p.year}年</td><td>${p.pos}</td><td class="right">${overall(p)}</td></tr>`).join("")}</table></div>`;
}
function scoutScreen(){
 if(state.selected===null)return `<div class="card">高校を選択してください。</div>`;
 let p=state.lastScout; return `<div class="card"><div class="row"><h2>夏のスカウト</h2><span class="pill">残り ${state.scouts}回</span></div><p>候補は毎回ランダム生成。入学時点の能力を確認してから採用。</p><button class="btn" onclick="scout()" ${state.scouts<=0?"disabled":""}>候補を探す</button>
 ${p?`<hr><div class="row"><b>${p.name}</b><span>${p.talent?"⭐ 天才選手":""}${p.foreign?" 🌍 留学生":""}</span></div><p>${p.pos} / 総合 ${overall(p)}</p>${Object.entries(p.stats).map(([k,v])=>`<p>${k} ${v}<span class="bar"><i style="width:${v}%"></i></span></p>`).join("")}<button class="btn" onclick="signScout()">この選手を獲得</button>`:""}</div>`;
}
function world(){
 let b=state.worldBest||[]; return `<div class="hero"><h2>🌏 世界ラグビー</h2><p>毎年2月に年代別ベスト15を選出し、世界選抜と対戦します。</p></div><div class="card"><h2>${state.year}年度 ベスト15</h2>${b.length?`<table>${b.map((p,i)=>`<tr><td>${i+1}</td><td>${p.name}</td><td>${p.pos}</td><td class="right">${overall(p)}</td></tr>`).join("")}</table>`:"<p>2月のイベントで選出されます。</p>"}</div><div class="card"><h2>大会・代表</h2><p>次段階で全国大会、大学、日本代表、W杯を追加します。</p></div>`;
}
if(!state)init();
render();
</script></body></html>
